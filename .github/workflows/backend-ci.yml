name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --select F,E9 backend/app backend/tests

      - name: Type check (pyright)
        run: pyright backend/app backend/tests

      - name: Security scan (bandit)
        run: bandit -q -r backend/app -x backend/venv -lll -iii

      - name: Migration check (offline SQL render)
        working-directory: backend
        run: alembic upgrade head --sql > /tmp/alembic-offline.sql

      - name: Tests
        working-directory: backend
        run: pytest -q
